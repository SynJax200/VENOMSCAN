# Free-tier blueprint: API + web as two Render Docker services, Postgres on Neon.
#
# 1. Create a free Neon project and copy its connection string
#    (it must end with ?sslmode=require).
# 2. Render dashboard -> New -> Blueprint -> pick this repo.
# 3. When prompted, paste DATABASE_URL — that is the only value to enter;
#    every other URL is wired to the services Render just created.
# 4. Open the web URL, set ALLOW_REGISTRATION=true on venomscan-api, register
#    your account (the first one becomes admin), then set it back to false.
#
# Neon is used instead of Render Postgres because free Render databases expire
# after 30 days. Free services sleep after 15 minutes idle and cold-start in
# about a minute; a PDF render on a heavy report can run out of the 512 MB.

services:
  - type: web
    name: venomscan-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./infra/docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: API_BASE
        fromService:
          name: venomscan-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEB_BASE
        fromService:
          name: venomscan-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          name: venomscan-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: DEMO_ENABLED
        value: "false"
      - key: LOGIN_STATE_BACKEND
        value: memory
      - key: TASK_MODE
        value: inline
      - key: SCAN_DEFAULT_PROFILE
        value: safe
      - key: SCAN_MAX_REQUESTS
        value: "60"
      - key: SCAN_MAX_SECONDS
        value: "45"
      - key: SCAN_RPS
        value: "2"
      - key: SCAN_OSINT_ENABLED
        value: "true"
      - key: SCAN_HISTORY_ENABLED
        value: "true"
      - key: SCAN_SPA_ENABLED
        value: "false"
      - key: SCAN_DIRS_ENABLED
        value: "false"
      - key: OOB_ENABLED
        value: "false"
      - key: NUCLEI_ENABLED
        value: "false"
      - key: PLUGIN_DIRS
        value: ""
      - key: ALLOW_PRIVATE_TARGETS
        value: "false"
      - key: AI_AUTO_TRIAGE
        value: "false"
      - key: AI_REPORT_AUTOFILL
        value: "false"
      - key: REPORT_LINK_HOURS
        value: "24"

  - type: web
    name: venomscan-web
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./infra/docker/Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      # Render's fromService `host` is the private short name (`venomscan-api`),
      # which Next cannot reach over TLS; use the public URL the build needs.
      - key: API_INTERNAL_URL
        value: https://venomscan-api.onrender.com
