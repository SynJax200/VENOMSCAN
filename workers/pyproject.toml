[project]
name = "venomscan-workers"
version = "0.1.0"
description = "VENOMSCAN Celery workers"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "redis>=5.2",
    "venomscan-api",
    "venomscan-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["venomscan_workers"]

[tool.uv.sources]
venomscan-api = { workspace = true }
venomscan-engine = { workspace = true }
