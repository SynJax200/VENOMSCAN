[project]
name = "venomscan-engine"
version = "0.1.0"
description = "VENOMSCAN standalone scanning engine"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.7",
    "cryptography>=43",
    "pydantic>=2.9",
    "playwright>=1.65.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["venomscan_engine"]
