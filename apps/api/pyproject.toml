[project]
name = "venomscan-api"
version = "0.1.0"
description = "VENOMSCAN control plane (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "redis>=5.0",
    "venomscan-engine",
    "pg8000>=1.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["venomscan_api"]

[tool.uv.sources]
venomscan-engine = { workspace = true }
